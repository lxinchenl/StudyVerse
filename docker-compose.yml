services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data/users:/app/data/users
      - ./data/settings:/app/data/settings
      - ./data/generated_resources:/app/data/generated_resources
      - ./data/kg:/app/data/kg
      - ./data/courses:/app/data/courses
    env_file:
      - .env
    networks:
      - studyverse-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE: http://120.27.131.220/api
    command: npm run start
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://120.27.131.220/api
    networks:
      - studyverse-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - studyverse-net

networks:
  studyverse-net:
    driver: bridge
